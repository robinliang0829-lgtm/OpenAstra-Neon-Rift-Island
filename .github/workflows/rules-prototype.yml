name: rules-prototype

on:
  push:
  pull_request:

jobs:
  steel-tide:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rules prototype tests
        run: PYTHONPATH=sim python3 -m unittest discover -s sim/tests -v
      - name: Scripted reproductions
        run: PYTHONPATH=sim python3 -m steel_tide repro
      - name: NR-02 dual-end 3v3
        run: PYTHONPATH=sim python3 -m steel_tide nr02 --check
      - name: NR-M1 prep slice
        run: PYTHONPATH=sim python3 -m steel_tide m1 --check
