<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="806" viewBox="0 0 1440 806" role="img" aria-labelledby="t d"><title id="t">霓虹断层岛 UE5 游戏组工作流</title><desc id="d">Notion 定范围，PM-Astra 调度，Codex 主创，Blender 出模，UE5 进游，实机问题按操作卡返回主创。</desc><style>text{font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",sans-serif}</style><rect x="0" y="0" width="1440" height="806" rx="0" fill="#f4f4ef" stroke="none"/><rect x="0" y="0" width="1440" height="190" rx="0" fill="#0d2332" stroke="none"/><rect x="45" y="36" width="5" height="113" rx="0" fill="#57ded3" stroke="none"/><text x="69" y="59" font-size="18" fill="#8bded9" font-weight="600" letter-spacing="2">OPENASTRA   /   WORLD PRODUCTION</text><text x="68" y="124" font-size="52" fill="#f8faf6" font-weight="700" letter-spacing="0">霓虹断层岛 · 游戏组工作流</text><text x="70" y="161" font-size="23" fill="#bbcad0" font-weight="400" letter-spacing="0">沿用创世岛五步工序，本岛使用 Unreal Engine 5。</text><text x="1105" y="74" font-size="39" fill="#f9f4e7" font-weight="700" letter-spacing="2">NEON RIFT</text><text x="1110" y="112" font-size="21" fill="#8bded9" font-weight="400" letter-spacing="0">任务 02  /  独立对战岛</text><text x="48" y="240" font-size="25" fill="#193747" font-weight="700" letter-spacing="0">01   主施工线</text><rect x="48" y="266" width="247" height="213" rx="12" fill="#fffefa" stroke="#d6dfdd"/><rect x="48" y="266" width="247" height="6" rx="0" fill="#177c78" stroke="2"/><text x="64" y="310" font-size="24" fill="#177c78" font-weight="700" letter-spacing="0">01</text><text x="64" y="354" font-size="28" fill="#0e2935" font-weight="700" letter-spacing="0">Notion 定范围</text><text x="64" y="388" font-size="17" fill="#177c78" font-weight="600" letter-spacing="0">Robin / 项目资料</text><text x="64" y="429" font-size="16" fill="#102a38" font-weight="400" letter-spacing="0">定阵营、世界观和范围</text><text x="64" y="456" font-size="16" fill="#102a38" font-weight="400" letter-spacing="0">记录已定项与试玩提案</text><path d="M298 373 h20 m-6 -5 l6 5 -6 5" stroke="#266371" stroke-width="2.5" fill="none"/><rect x="322" y="266" width="247" height="213" rx="12" fill="#fffefa" stroke="#d6dfdd"/><rect x="322" y="266" width="247" height="6" rx="0" fill="#126b91" stroke="2"/><text x="338" y="310" font-size="24" fill="#126b91" font-weight="700" letter-spacing="0">02</text><text x="338" y="354" font-size="28" fill="#0e2935" font-weight="700" letter-spacing="0">PM-Astra 调度</text><text x="338" y="388" font-size="17" fill="#126b91" font-weight="600" letter-spacing="0">游戏组 PM</text><text x="338" y="429" font-size="16" fill="#102a38" font-weight="400" letter-spacing="0">排期、分卡、组织验收</text><text x="338" y="456" font-size="16" fill="#102a38" font-weight="400" letter-spacing="0">向 Robin 提交待裁决项</text><path d="M572 373 h20 m-6 -5 l6 5 -6 5" stroke="#266371" stroke-width="2.5" fill="none"/><rect x="596" y="266" width="247" height="213" rx="12" fill="#fffefa" stroke="#d6dfdd"/><rect x="596" y="266" width="247" height="6" rx="0" fill="#714b88" stroke="2"/><text x="612" y="310" font-size="24" fill="#714b88" font-weight="700" letter-spacing="0">03</text><text x="612" y="354" font-size="28" fill="#0e2935" font-weight="700" letter-spacing="0">Codex 主创</text><text x="612" y="388" font-size="17" fill="#714b88" font-weight="600" letter-spacing="0">总策划 / 程序 / 美术</text><text x="612" y="429" font-size="16" fill="#102a38" font-weight="400" letter-spacing="0">拆需求，写玩法与脚本</text><text x="612" y="456" font-size="16" fill="#102a38" font-weight="400" letter-spacing="0">出代码、美术稿和操作卡</text><path d="M846 373 h20 m-6 -5 l6 5 -6 5" stroke="#266371" stroke-width="2.5" fill="none"/><rect x="870" y="266" width="247" height="213" rx="12" fill="#fffefa" stroke="#d6dfdd"/><rect x="870" y="266" width="247" height="6" rx="0" fill="#ae6435" stroke="2"/><text x="886" y="310" font-size="24" fill="#ae6435" font-weight="700" letter-spacing="0">04</text><text x="886" y="354" font-size="28" fill="#0e2935" font-weight="700" letter-spacing="0">Blender 出模</text><text x="886" y="388" font-size="17" fill="#ae6435" font-weight="600" letter-spacing="0">Blender 操作 Agent</text><text x="886" y="429" font-size="16" fill="#102a38" font-weight="400" letter-spacing="0">按卡建模、绑定、出碰撞</text><text x="886" y="456" font-size="16" fill="#102a38" font-weight="400" letter-spacing="0">回交可视体和碰撞体</text><path d="M1120 373 h20 m-6 -5 l6 5 -6 5" stroke="#266371" stroke-width="2.5" fill="none"/><rect x="1144" y="266" width="247" height="213" rx="12" fill="#fffefa" stroke="#d6dfdd"/><rect x="1144" y="266" width="247" height="6" rx="0" fill="#28634d" stroke="2"/><text x="1160" y="310" font-size="24" fill="#28634d" font-weight="700" letter-spacing="0">05</text><text x="1160" y="354" font-size="28" fill="#0e2935" font-weight="700" letter-spacing="0">UE5 进游</text><text x="1160" y="388" font-size="17" fill="#28634d" font-weight="600" letter-spacing="0">虚幻引擎操作 Agent</text><text x="1160" y="429" font-size="16" fill="#102a38" font-weight="400" letter-spacing="0">导入、搭关卡、接编辑器事件</text><text x="1160" y="456" font-size="16" fill="#102a38" font-weight="400" letter-spacing="0">双端试玩、录屏、打包</text><rect x="48" y="502" width="1343" height="63" rx="9" fill="#ddeeea" stroke="none"/><text x="69" y="542" font-size="23" fill="#166557" font-weight="700" letter-spacing="0">返修回路</text><text x="229" y="541" font-size="21" fill="#1c453e" font-weight="400" letter-spacing="0">操作 Agent 回传构建版本、双端录像和复现步骤  →  Codex 修代码或美术  →  PM 发下一轮卡</text><text x="48" y="623" font-size="24" fill="#193747" font-weight="700" letter-spacing="0">02   按需补位</text><text x="312" y="623" font-size="22" fill="#345262" font-weight="400" letter-spacing="0">开源资产对接  /  人物设定生成  /  Tripo</text><path d="M48 649 L1391 649" stroke="#c7d3d2" stroke-width="1" fill="none"/><text x="48" y="698" font-size="24" fill="#193747" font-weight="700" letter-spacing="0">03   旁路分工</text><text x="312" y="698" font-size="21" fill="#345262" font-weight="400" letter-spacing="0">视频团队取用实机素材；Gio 仅在涉及公共底座时介入。猎手岛、创世岛继续独立施工。</text><rect x="0" y="755" width="1440" height="51" rx="0" fill="#0d2332" stroke="none"/><text x="48" y="788" font-size="18" fill="#cad8d8" font-weight="400" letter-spacing="0">施工参考 v0.1    /    创世岛原流程不变</text><text x="1060" y="788" font-size="17" fill="#8bded9" font-weight="600" letter-spacing="1">02  /  NEON RIFT  /  UE5</text></svg>